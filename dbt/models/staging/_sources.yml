version: 2

sources:
  - name: raw
    description: Tables written by the Python pipeline (src/regtracker).
    schema: main
    tables:
      - name: documents
      - name: document_versions
        loaded_at_field: fetched_at
        freshness:
          # Weekly ingestion: anything older than 8 days means a run was missed.
          warn_after: {count: 8, period: day}
          error_after: {count: 15, period: day}
      - name: sections
      - name: changes
      - name: enrichments
      - name: pipeline_runs
