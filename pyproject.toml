[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-reg-tracker"
version = "0.1.0"
description = "EU digital regulation change tracker: ingestion, versioning, article-level diff, LLM enrichment, cited RAG, dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "lxml>=5.0",
  "beautifulsoup4>=4.12",
  "rapidfuzz>=3.6",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
ml = ["sentence-transformers>=3.0", "numpy>=1.26"]
app = ["fastapi>=0.111", "uvicorn>=0.30", "huggingface_hub>=0.23", "numpy>=1.26"]
pipeline = ["dbt-duckdb>=1.8", "dagster>=1.7", "dagster-webserver>=1.7", "dagster-dbt>=0.23"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]

[project.scripts]
regtracker = "regtracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/regtracker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
