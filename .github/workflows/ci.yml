name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,llm,app]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy src
      - name: Tests (no network, no real LLM)
        run: pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e . "dbt-duckdb>=1.8"
      - name: Build fixture warehouse (no network)
        run: regtracker fixture-db --out data/fixture.duckdb
      - name: dbt build (models + tests)
        env:
          WAREHOUSE_PATH: data/fixture.duckdb
        run: dbt build --project-dir dbt --profiles-dir dbt
