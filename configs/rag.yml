# Retrieval and answering settings. Thresholds are tuned on eval/datasets/qa_set.jsonl
# (see docs/eval-report.md); change them only together with a new eval run.
top_k: 5
chunk_max_tokens: 300
# Refusal gate: if the best cosine similarity (E5, query vs passage) is below this, the LLM
# is not called and the closest passages are returned with "not enough evidence".
min_cosine: 0.80
max_question_chars: 500
prompt_version: qa-v1
